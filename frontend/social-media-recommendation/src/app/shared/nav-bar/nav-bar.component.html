<nav class="navbar-container">
  <div class="navbar-content">
    <a class="navbar-brand" routerLink="/posts">
      FYP
    </a>

    <div class="navbar-menu" *ngIf="isLoggedIn">
      <a class="nav-link" routerLink="/posts" routerLinkActive="active">Posts</a>
      <a class="nav-link" routerLink="/create-post" routerLinkActive="active">Create post</a>
    </div>

    <div class="navbar-actions">
      <ng-container *ngIf="isLoggedIn">
        <button class="cep-demo-btn" (click)="runTrendSimulation()" [disabled]="trendSimLoading" title="Simulate Relevant Trend CEP Rule">
          {{ trendSimLoading ? '...' : 'Sim Trend' }}
        </button>
        <button class="cep-demo-btn" (click)="runSaturationSimulation()" [disabled]="saturationSimLoading" title="Simulate Audience Saturation CEP Rule">
          {{ saturationSimLoading ? '...' : 'Sim Saturation' }}
        </button>
        <button class="cep-demo-btn" (click)="runViralMomentumSimulation()" [disabled]="viralSimLoading" title="Simulate Viral Momentum CEP Rule">
          {{ viralSimLoading ? '...' : 'Sim Viral' }}
        </button>
      </ng-container>

      <button *ngIf="isLoggedIn" class="logout-btn" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>

      <div class="auth-links" *ngIf="!isLoggedIn">
        <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
        <a class="nav-link" routerLink="/register" routerLinkActive="active">Register</a>
      </div>
    </div>
  </div>
</nav>
